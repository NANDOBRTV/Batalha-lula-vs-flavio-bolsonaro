<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Batalha: Lula vs Flávio Bolsonaro</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Arial Black', sans-serif;
    background: radial-gradient(circle at center, #1a1a2e 0%, #0a0a0a 100%);
    color: white; min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; padding: 20px; overflow: hidden;
  }
  h1 {
    font-size: 2.3em; text-align: center; margin-bottom: 15px;
    background: linear-gradient(90deg, #e53935, #fff, #1e88e5);
    -webkit-background-clip: text; background-clip: text;
    color: transparent; text-transform: uppercase;
    letter-spacing: 2px;
  }
  .arena {
    display: flex; justify-content: space-between;
    width: 100%; max-width: 1200px;
    gap: 20px; flex: 1; align-items: center;
  }
  .fighter {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; gap: 12px;
    padding: 20px; border-radius: 20px;
    min-width: 0; transition: box-shadow 0.2s;
  }
  .fighter.lula   { background: linear-gradient(180deg, rgba(229,57,53,0.3), rgba(229,57,53,0.05)); border: 3px solid #e53935; }
  .fighter.flavio { background: linear-gradient(180deg, rgba(30,136,229,0.3), rgba(30,136,229,0.05)); border: 3px solid #1e88e5; }

  .avatar {
    font-size: 8em; line-height: 1;
    animation: idle 2s ease-in-out infinite;
  }
  .fighter.lula   .avatar { filter: drop-shadow(0 0 25px #e53935); }
  .fighter.flavio .avatar { filter: drop-shadow(0 0 25px #1e88e5); }
  @keyframes idle { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

  .fighter.hit .avatar { animation: shake 0.35s; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25%     { transform: translateX(-18px) rotate(-6deg); }
    75%     { transform: translateX(18px)  rotate(6deg); }
  }

  .name { font-size: 1.8em; text-transform: uppercase; letter-spacing: 3px; }

  .hp-bar-container {
    width: 100%; height: 42px; background: #222;
    border-radius: 22px; overflow: hidden;
    border: 2px solid #fff; position: relative;
  }
  .hp-bar { height: 100%; transition: width 0.3s ease-out; }
  .lula   .hp-bar { background: linear-gradient(90deg, #ff5252, #e53935); }
  .flavio .hp-bar { background: linear-gradient(90deg, #42a5f5, #1e88e5); }
  .hp-text {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 0.95em; text-shadow: 2px 2px 4px black;
    z-index: 2;
  }

  .vs {
    font-size: 4em; color: #ffd54f;
    text-shadow: 0 0 25px #ffd54f;
    animation: pulse 1s infinite; flex-shrink: 0;
  }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.15); } }

  .hint {
    text-align: center; margin-top: 20px;
    font-size: 1.1em; color: #aaa;
  }
  .hint code {
    background: #222; padding: 3px 8px;
    border-radius: 5px; color: #ffd54f;
    font-family: monospace;
  }

  #log {
    position: fixed; bottom: 20px; right: 20px;
    width: 340px; max-height: 220px; overflow-y: auto;
    background: rgba(0,0,0,0.85); border: 1px solid #444;
    border-radius: 10px; padding: 10px;
    font-size: 0.85em; font-family: monospace;
  }
  #log p { margin: 3px 0; }
  .event-chat   { color: #4fc3f7; }
  .event-gift   { color: #ffd54f; }
  .event-like   { color: #ff8a65; }
  .event-follow { color: #81c784; }

  .winner {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 4.5em; text-transform: uppercase;
    padding: 30px 60px; border-radius: 20px;
    background: rgba(0,0,0,0.95); border: 5px solid #ffd54f;
    display: none; z-index: 100; text-align: center;
    animation: pulse 0.5s infinite;
  }
</style>
</head>
<body>

<h1>⚔️ Lula vs Flávio Bolsonaro ⚔️</h1>

<div class="arena">
  <div class="fighter lula" id="fighter-lula">
    <div class="avatar">🦑</div>
    <div class="name">Lula</div>
    <div class="hp-bar-container">
      <div class="hp-text" id="hp-text-lula">1000 / 1000</div>
      <div class="hp-bar" id="hp-bar-lula" style="width:100%"></div>
    </div>
  </div>

  <div class="vs">VS</div>

  <div class="fighter flavio" id="fighter-flavio">
    <div class="avatar">🦅</div>
    <div class="name">Flávio</div>
    <div class="hp-bar-container">
      <div class="hp-text" id="hp-text-flavio">1000 / 1000</div>
      <div class="hp-bar" id="hp-bar-flavio" style="width:100%"></div>
    </div>
  </div>
</div>

<div class="hint">
  Digite <code>!lula</code> ou <code>!flavio</code> no chat para escolher seu time · Likes, presentes e mensagens causam dano!
</div>

<div id="log"></div>
<div class="winner" id="winner"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
// ========== ESTADO DO JOGO ==========
const MAX_HP = 1000;
const state = {
  hp: { lula: MAX_HP, flavio: MAX_HP },
  userTeam: {},           // { uniqueId: 'lula' | 'flavio' }
  gameOver: false
};

const el = {
  barLula:    document.getElementById('hp-bar-lula'),
  barFlavio:  document.getElementById('hp-bar-flavio'),
  textLula:   document.getElementById('hp-text-lula'),
  textFlavio: document.getElementById('hp-text-flavio'),
  fighterLula:   document.getElementById('fighter-lula'),
  fighterFlavio: document.getElementById('fighter-flavio'),
  log:    document.getElementById('log'),
  winner: document.getElementById('winner')
};

const socket = io();

// ========== HELPERS ==========
function addLog(msg, cls = '') {
  const p = document.createElement('p');
  p.textContent = msg;
  if (cls) p.className = cls;
  el.log.appendChild(p);
  el.log.scrollTop = el.log.scrollHeight;
}

function updateBars() {
  el.barLula.style.width   = (state.hp.lula   / MAX_HP * 100) + '%';
  el.barFlavio.style.width = (state.hp.flavio / MAX_HP * 100) + '%';
  el.textLula.textContent   = `${Math.max(0, Math.round(state.hp.lula))} / ${MAX_HP}`;
  el.textFlavio.textContent = `${Math.max(0, Math.round(state.hp.flavio))} / ${MAX_HP}`;
}

function flashHit(team) {
  const target = team === 'lula' ? el.fighterLula : el.fighterFlavio;
  target.classList.remove('hit');
  void target.offsetWidth; // reinicia animação
  target.classList.add('hit');
}

function applyDamage(targetTeam, amount) {
  if (state.gameOver) return;
  state.hp[targetTeam] = Math.max(0, state.hp[targetTeam] - amount);
  flashHit(targetTeam);
  updateBars();
  if (state.hp[targetTeam] <= 0) {
    declareWinner(targetTeam === 'lula' ? 'flavio' : 'lula');
  }
}

function declareWinner(winner) {
  state.gameOver = true;
  el.winner.textContent = winner === 'lula' ? '🦑 LULA VENCEU!' : '🦅 FLÁVIO VENCEU!';
  el.winner.style.color = winner === 'lula' ? '#ff5252' : '#42a5f5';
  el.winner.style.display = 'block';
  addLog(`🏆 Vitória de ${winner.toUpperCase()}!`, 'event-gift');

  setTimeout(() => {
    state.hp = { lula: MAX_HP, flavio: MAX_HP };
    state.gameOver = false;
    el.winner.style.display = 'none';
    updateBars();
    addLog('🔄 Nova batalha começou!', 'event-follow');
  }, 8000);
}

// Aplica dano no INIMIGO do time do usuário. Retorna true se aplicou.
function damageFrom(user, amount) {
  const team = state.userTeam[user.toLowerCase()];
  if (!team || state.gameOver) return false;
  const enemy = team === 'lula' ? 'flavio' : 'lula';
  applyDamage(enemy, amount);
  return true;
}

function joinTeam(user, team) {
  state.userTeam[user.toLowerCase()] = team;
}

// ========== EVENTOS DO TIKTOK ==========
socket.on('tiktok-chat', ({ user, comment }) => {
  const txt = comment.trim().toLowerCase();

  if (txt === '!lula' || txt === 'lula') {
    joinTeam(user, 'lula');
    addLog(`➕ ${user} entrou no time LULA 🦑`, 'event-chat');
    return;
  }
  if (['!flavio','flavio','!flávio','flávio','!bolsonaro','bolsonaro'].includes(txt)) {
    joinTeam(user, 'flavio');
    addLog(`➕ ${user} entrou no time FLÁVIO 🦅`, 'event-chat');
    return;
  }

  // Mensagem normal: 2 de dano se já estiver num time
  if (damageFrom(user, 2)) {
    addLog(`💬 ${user}: "${comment}" (-2 HP)`, 'event-chat');
  } else {
    addLog(`💬 ${user}: ${comment}`, 'event-chat');
  }
});

socket.on('tiktok-like', ({ user, likeCount }) => {
  const dmg = Math.min(likeCount, 20); // cap pra não zerar de uma vez
  if (damageFrom(user, dmg)) {
    addLog(`❤️ ${user} deu ${likeCount} likes (-${dmg} HP)`, 'event-like');
  } else {
    addLog(`❤️ ${user} deu ${likeCount} likes`, 'event-like');
  }
});

socket.on('tiktok-gift', ({ user, giftName, amount, diamonds }) => {
  // dano = 10 * valor do presente * quantidade (máx 500 por evento)
  const dmg = Math.min(10 * diamonds * amount, 500);
  if (damageFrom(user, dmg)) {
    addLog(`🎁 ${user} enviou ${amount}x ${giftName} (-${dmg} HP!)`, 'event-gift');
  } else {
    addLog(`🎁 ${user} enviou ${amount}x ${giftName} (precisa entrar num time!)`, 'event-gift');
  }
});

socket.on('tiktok-follow', ({ user }) => {
  if (damageFrom(user, 50)) {
    addLog(`⭐ ${user} seguiu e causou -50 HP!`, 'event-follow');
  } else {
    addLog(`⭐ ${user} seguiu o canal!`, 'event-follow');
  }
});

// ========== INÍCIO ==========
updateBars();
addLog('🎮 Batalha iniciada! Digite !lula ou !flavio no chat.', 'event-follow');
</script>
</body>
</html>
